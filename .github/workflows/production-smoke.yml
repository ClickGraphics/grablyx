name: Production Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app.js"
      - "index.html"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify GRABLYX production API and Facebook Reel
        env:
          API: https://grablyx-api.onrender.com
          FACEBOOK_REEL: https://www.facebook.com/reel/1467483168533263
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.error

          api = os.environ["API"]
          reel = os.environ["FACEBOOK_REEL"]

          def request(req, timeout=30):
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read().decode("utf-8", "replace")

          last = None
          expected = os.environ["EXPECTED_SHA"]
          for _ in range(36):
              try:
                  status, body = request(urllib.request.Request(api + "/health"), timeout=15)
                  health = json.loads(body)
                  revision = health.get("revision", "")
                  if status == 200 and revision == expected:
                      print("production revision", revision)
                      print("yt_dlp", health.get("yt_dlp"))
                      break
                  last = f"waiting for {expected}, production has {revision}"
              except Exception as exc:
                  last = exc
              time.sleep(5)
          else:
              raise SystemExit(f"production revision not ready: {last}")

          payload = json.dumps({"url": reel}).encode()
          req = urllib.request.Request(
              api + "/analyze",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              status, body = request(req, timeout=45)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")
              print(f"analyze HTTP {exc.code}: {body}")
              raise SystemExit(2)
          data = json.loads(body)
          formats = data.get("formats") or []
          downloadable = [f for f in formats if isinstance(f, dict) and f.get("download")]
          if status != 200 or not (data.get("combined") or downloadable):
              raise SystemExit("analyze returned no downloadable media: " + body[:1000])
          print(json.dumps({
              "ok": True,
              "title": data.get("title"),
              "combined": bool(data.get("combined")),
              "downloadable_formats": len(downloadable),
          }, ensure_ascii=False))
          PY


      - name: Diagnose public Facebook HTML when extractor fails
        if: failure()
        env:
          FACEBOOK_REEL: https://www.facebook.com/reel/1467483168533263
        run: |
          python - <<'PY'
          import html, json, os, re, urllib.request, urllib.error

          url = os.environ["FACEBOOK_REEL"]
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read(5_000_000)
                  print("status", r.status)
                  print("final_url", r.geturl())
                  print("content_type", r.headers.get("content-type"))
          except urllib.error.HTTPError as exc:
              raw = exc.read(5_000_000)
              print("status", exc.code)
              print("final_url", exc.geturl())
              print("content_type", exc.headers.get("content-type"))

          text = raw.decode("utf-8", "replace")
          print("bytes", len(raw))
          markers = [
              "og:video", "og:video:url", "og:video:secure_url",
              "browser_native_hd_url", "browser_native_sd_url",
              "playable_url", "playable_url_quality_hd",
              "dash_manifest", "login", "require_login",
              "video_redirect", "fbcdn.net",
          ]
          for marker in markers:
              print(marker, text.lower().count(marker.lower()))

          patterns = [
              r'<meta[^>]+property=["\']og:video(?::url|:secure_url)?["\'][^>]+content=["\']([^"\']+)["\']',
              r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+property=["\']og:video(?::url|:secure_url)?["\']',
              r'"(?:browser_native_hd_url|browser_native_sd_url|playable_url|playable_url_quality_hd)"\s*:\s*"([^"]+)"',
          ]
          found = []
          for pattern in patterns:
              for value in re.findall(pattern, text, flags=re.I):
                  try:
                      value = json.loads('"' + value.replace('"', '\\"') + '"')
                  except Exception:
                      pass
                  value = html.unescape(value).replace("\\/", "/")
                  if value.startswith("https://") and value not in found:
                      found.append(value)
          print("candidate_count", len(found))
          for value in found[:5]:
              host = urllib.request.urlparse(value).hostname if False else ""
              print("candidate_prefix", value[:180])
          PY
