name: Backend checks
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -U --pre "yt-dlp[default,curl-cffi]"
      - name: Import application and check health
        run: |
          cd backend
          python - <<'PY'
          from fastapi.testclient import TestClient
          from main import app
          client = TestClient(app)
          health = client.get("/health").json()
          assert health.get("ok") is True
          assert health.get("yt_dlp")
          for url in ["http://facebook.com/reel/1", "https://localhost/reel/1", "https://example.com/a"]:
              assert client.post("/analyze", json={"url": url}).status_code == 400
          assert client.get("/download", params={"token": "invalid"}).status_code == 400
          import re
          assert re.fullmatch(r"/reel/(\d+)/?", "/reel/1467483168533263")
          print("Backend smoke tests passed")
          PY
